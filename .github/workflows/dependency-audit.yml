name: Dependency vulnerability audit (pip-audit)

# M3 verification ownership (Masego). Separate file from test.yml/secret-scan.yml/lint.yml so it
# can evolve independently - coordinate any dependency/workflow overlap with Don before changing.
#
# Scans requirements.txt for known published vulnerabilities (OSV/PyPI advisory data) in Flask,
# gunicorn, pytest and their transitive dependencies. Does not touch requirements.txt itself -
# that stays Don's file. Non-blocking for the same reason as lint.yml: a first run's findings
# need owners and a remediation plan before this can safely gate merges.

on:
  pull_request:
    paths: ['requirements.txt']
  push:
    branches: [main]
    paths: ['requirements.txt']
  schedule:
    # Weekly, independent of any push, since new CVEs can be published against pinned versions
    # at any time with no code change in this repo to trigger the path filters above.
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned, verified against PyPI (pip-audit 2.10.1, Apache-2.0). CI-only tool, not an app
      # dependency - not added to requirements.txt.
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit requirements.txt for known vulnerabilities
        run: python -m pip-audit -r requirements.txt
        continue-on-error: true

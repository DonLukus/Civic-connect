name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit pytest-cov==7.1.0

      - name: Run tests
        run: >-
          python -m pytest tests/ -q --cov=src.persistence
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json --cov-fail-under=70

      - name: Retain persistence coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Bandit static analysis
        run: python -m bandit -r src -ll

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

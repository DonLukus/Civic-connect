name: Secret scan

# Evidence for NFR-005: no credential, key, token or connection string in the repository.
# This is a lightweight guard. Enable GitHub's native secret scanning and push protection as well —
# this workflow does not replace it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan source/config files for credential patterns
        run: |
          set -e

          # Restrict scanning to real source/config files. We intentionally ignore documentation,
          # example files, and sample values because the repo contains README examples like
          # sample values documented elsewhere are not real secrets.
          PATTERNS="(password|passwd|pwd|api[_-]?key|secret[_-]?key|private[_-]?key|token|auth[_-]?token)[[:space:]]*[=:][[:space:]]*(['\"][^'\"]{8,}['\"]|[A-Za-z0-9_+/=-]{20,})|BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}"

          if grep -RInEi --binary-files=without-match \
               --include='*.py' \
               --include='*.yml' \
               --include='*.yaml' \
               --include='*.json' \
               --include='*.toml' \
               --include='*.ini' \
               --include='*.cfg' \
               --include='*.sh' \
               --include='*.sql' \
               --include='*.env' \
               --include='.env' \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude='*.md' \
               --exclude='.env.example' \
               --exclude='*.csv' \
               --exclude='*.txt' \
               "$PATTERNS" . ; then
            echo "::error::Possible secret detected. Do not merge. Rotate the credential if it is real, then purge it from history."
            exit 1
          fi
          echo "No credential patterns found in source/config files."

      - name: Check for committed secrets (environment files)
        run: |
          # ALLOWLIST: templates and examples (safe to commit, contain no secrets)
          ALLOWLIST='\.env\.example$|appsettings\.Example\.json$'

          # BLOCKLIST: actual environment files and key files (must NOT be committed)
          BLOCKLIST='(^|/)\.env($|\.(local|dev|development|prod|production|test|staging))|(^|/)appsettings\.(Development|Production)\.json$|\.pem$|\.pfx$|\.p12$|\.key$'

          # Find all matches against blocklist
          TRACKED_FILES=$(git ls-files | grep -E "$BLOCKLIST" || true)

          # Filter out allowlist exceptions
          TRACKED_SECRETS=$(echo "$TRACKED_FILES" | grep -vE "$ALLOWLIST" || true)

          if [ -n "$TRACKED_SECRETS" ]; then
            echo "::error::Secrets or environment files are tracked:"
            echo "$TRACKED_SECRETS"
            echo ""
            echo "Commit these to .gitignore or remove them:"
            echo "  git rm --cached <file>"
            echo "  git rm -r --cached <dir>/"
            echo ""
            echo "If this is a template (e.g., .env.example), add it to the ALLOWLIST in the workflow."
            exit 1
          fi

          echo "No secrets or environment files tracked. ✓"

      - name: Verify .gitignore excludes sensitive files
        run: |
          # Confirm critical patterns are ignored
          CRITICAL_PATTERNS='.env|\.pem|\.pfx|\.p12|\.key|appsettings\.(Development|Production)\.json'

          MISSING_IGNORES=$(comm -23 \
            <(git ls-files --others --ignored --exclude-standard | grep -E "$CRITICAL_PATTERNS" | sort || true) \
            <(git ls-files | grep -E "$CRITICAL_PATTERNS" | sort || true) \
          )

          if [ -n "$MISSING_IGNORES" ]; then
            echo "::warning::These sensitive files exist but are not ignored:"
            echo "$MISSING_IGNORES"
            echo ""
            echo "Add them to .gitignore immediately (before committing real values)."
          else
            echo "All sensitive file patterns are properly ignored. ✓"
          fi

name: Tests

# Runs the automated test suite on every PR touching src/ or tests/. Added M2, once code
# existed to test - FEC-03 names this as an M2 concern, not something to bolt on in M3.

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'requirements.txt']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'requirements.txt']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

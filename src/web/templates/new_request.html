<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Submit a service request — CivicConnect</title>
</head>
<body>
  <h1>Submit a service request</h1>

  {% if error %}
    <p style="color:#b00020;"><strong>Could not submit:</strong> {{ error }}</p>
  {% endif %}

  <!-- FR-005: title, description, category and location are mandatory.
       FR-006: category comes only from the controlled, active list below. -->
  <form method="post" action="/requests">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p>
      <label for="title">Title</label><br>
      <input type="text" id="title" name="title" value="{{ values.get('title', '') }}" required>
    </p>
    <p>
      <label for="description">Description</label><br>
      <textarea id="description" name="description" required>{{ values.get('description', '') }}</textarea>
    </p>
    <p>
      <label for="category_id">Category</label><br>
      <select id="category_id" name="category_id" required>
        <option value="">Select a category</option>
        {% for cat_id, cat_name in categories %}
          <option value="{{ cat_id }}" {% if values.get('category_id')|string == cat_id|string %}selected{% endif %}>{{ cat_name }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label for="location">Location</label><br>
      <input type="text" id="location" name="location" value="{{ values.get('location', '') }}" required>
    </p>
    <p><button type="submit">Submit request</button></p>
  </form>
</body>
</html>

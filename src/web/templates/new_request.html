{% extends "base.html" %}
{% block title %}Submit a service request — CivicConnect{% endblock %}
{% block content %}
  <h1>Submit a service request</h1>
  <p class="page-intro">Tell us what needs attention. All fields are required.</p>

  {% if error %}
    <p class="error-text"><strong>Could not submit:</strong> {{ error }}</p>
  {% endif %}

  <!-- FR-005: title, description, category and location are mandatory.
       FR-006: category comes only from the controlled, active list below. -->
  <form method="post" action="/requests" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Streetlight not working" value="{{ values.get('title', '') }}" required>
    </p>
    <p>
      <label for="description">Description</label>
      <textarea id="description" name="description" required>{{ values.get('description', '') }}</textarea>
    </p>
    <p>
      <label for="category_id">Category</label>
      <select id="category_id" name="category_id" required>
        <option value="">Select a category</option>
        {% for cat_id, cat_name in categories %}
          <option value="{{ cat_id }}" {% if values.get('category_id')|string == cat_id|string %}selected{% endif %}>{{ cat_name }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Street, suburb or landmark" value="{{ values.get('location', '') }}" required>
    </p>
    <p><button type="submit">Submit request</button> <a class="button button--secondary" href="/requests">Cancel</a></p>
  </form>
{% endblock %}
